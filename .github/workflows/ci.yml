name: test-and-build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r api/requirements-dev.txt
      - run: ruff check api scripts/smoke.py
      - run: ruff format --check api scripts/smoke.py
      - run: pytest -q
      - run: node --check ui/app.js
      - run: bash -n scripts/deploy.sh scripts/backup.sh
      - run: shellcheck scripts/*.sh
      - name: Test the three-container stack
        env:
          DB_PASSWORD: ci-only-disposable-password
        run: |
          docker compose up -d --build --wait --wait-timeout 240
          python scripts/smoke.py http://127.0.0.1:8080
      - name: Container logs on failure
        if: failure()
        env:
          DB_PASSWORD: ci-only-disposable-password
        run: docker compose logs --tail=80
      - name: Remove disposable CI containers
        if: always()
        env:
          DB_PASSWORD: ci-only-disposable-password
        run: docker compose down -v
